name: Deploy ABI static assets to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abi-assets-pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate ABI asset tree
        shell: bash
        run: |
          set -euo pipefail

          for directory in localization lib image data css _abi; do
            test -d "$directory"
          done

          for forbidden in ads.txt favicon.ico google11185a345fecb761.html sitemap.xml; do
            if test -e "$forbidden"; then
              echo "Unexpected root asset: $forbidden" >&2
              exit 1
            fi
          done

          if find . -path './.git' -prune -o -type l -print -quit | grep -q .; then
            echo 'Symlinks are not allowed in the published asset tree.' >&2
            exit 1
          fi

          if find localization lib image data css _abi -type f \( \
              -iname 'active-release.json' -o \
              -iname 'release-manifest*' -o \
              -iname 'server-boot-package*' -o \
              -iname '.publish*' -o \
              -iname '.env' -o -iname '.env.*' -o \
              -iname 'credential*.json' -o -iname 'secret*.json' -o \
              -iname 'id_rsa*' -o \
              -iname '*.pfx' -o -iname '*.p12' -o -iname '*.pem' -o \
              -iname '*.key' -o -iname '*.snk' -o -iname '*.asc' -o -iname '*.gpg' \
            \) -print -quit | grep -q .; then
            echo 'The asset tree contains a private or credential-like file.' >&2
            exit 1
          fi

          while IFS= read -r -d '' file; do
            size=$(stat -c '%s' "$file")
            if [ "$size" -gt 104857600 ]; then
              echo "File exceeds GitHub's 100 MiB limit: $file" >&2
              exit 1
            fi
          done < <(find localization lib image data css _abi -type f -print0)

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a localization lib image data css _abi _site/
          : > _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
